name: ai_hustle_copilot
description: "AI-powered freelance assistant for discovering opportunities, generating proposals, and managing applications."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  envied: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.0.0
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  hive_flutter: ^1.1.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  meta: ^1.18.0
  riverpod_annotation: ^2.6.1
  supabase_flutter: ^2.9.0

dev_dependencies:
  build_runner: ^2.4.13
  envied_generator: ^1.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
